name: validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/assemble-index.mjs --dir examples/minimal-course
      - run: node scripts/validate-tutorial.mjs --dir examples/minimal-course
